name: Deploy Android to closed testing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-closed-testing
  cancel-in-progress: false

env:
  PLAY_PACKAGE_NAME: com.aipod.app
  PLAY_TRACK: alpha

jobs:
  verify-and-upload:
    name: Build and upload Android App Bundle
    runs-on: ubuntu-latest
    environment: play-closed
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore Android release signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/aipod-upload.jks
          chmod 600 android/keystore/aipod-upload.jks
          cat > android/key.properties <<EOF
          storeFile=../keystore/aipod-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Restore Firebase Android configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          chmod 600 android/app/google-services.json

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version_line=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          version_name=${version_line%%+*}
          version_code=${version_line##*+}
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          echo "Release version: $version_name (versionCode $version_code)"

      - name: Authenticate with Google Play API
        id: google-play-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token

      - name: Calculate next versionCode
        id: version-code
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google-play-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_TOKEN"

          api_base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PLAY_PACKAGE_NAME}"
          edit_id=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Length: 0' \
            "$api_base/edits" | jq -er '.id')

          cleanup() {
            curl --silent --output /dev/null --request DELETE \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              "$api_base/edits/$edit_id" || true
          }
          trap cleanup EXIT

          latest_version_code=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "$api_base/edits/$edit_id/tracks/$PLAY_TRACK" \
            | jq -er '[.releases[]?.versionCodes[]? | tonumber] | max // 0')
          next_version_code=$((latest_version_code + 1))

          if (( next_version_code > 2100000000 )); then
            echo "The calculated versionCode exceeds the Android limit: $next_version_code" >&2
            exit 1
          fi

          echo "version_code=$next_version_code" >> "$GITHUB_OUTPUT"
          echo "Latest Play versionCode: $latest_version_code"
          echo "Next versionCode: $next_version_code"

      - name: Build release app bundle
        env:
          VERSION_CODE: ${{ steps.version-code.outputs.version_code }}
        run: flutter build appbundle --release --build-number="$VERSION_CODE"

      - name: Upload to Google Play closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFiles: frontend/build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ env.PLAY_TRACK }}
          status: completed

      - name: Update production app version policy
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
          VERSION_CODE: ${{ steps.version-code.outputs.version_code }}
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$PROD_PATH"
          test -n "$VERSION_CODE"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$PROD_HOST" >> "$HOME/.ssh/known_hosts"

          ssh "$PROD_USER@$PROD_HOST" "APP_BUILD_NUMBER='$VERSION_CODE' PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$PROD_PATH"
          test -f .env

          backup_file=".env.bak-version-${APP_BUILD_NUMBER}-$(date +%Y%m%d%H%M%S)"
          cp .env "$backup_file"

          rollback() {
            cp "$backup_file" .env
            docker compose up -d --no-deps --force-recreate backend
          }
          trap rollback ERR

          if grep -q '^APP_LATEST_BUILD_NUMBER=' .env; then
            sed -i "s/^APP_LATEST_BUILD_NUMBER=.*/APP_LATEST_BUILD_NUMBER=$APP_BUILD_NUMBER/" .env
          else
            printf '\nAPP_LATEST_BUILD_NUMBER=%s\n' "$APP_BUILD_NUMBER" >> .env
          fi

          docker compose up -d --no-deps --force-recreate backend

          for attempt in $(seq 1 30); do
            response=$(curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:3000/app-version 2>/dev/null || true)
            case "$response" in
              *"\"latestBuildNumber\":$APP_BUILD_NUMBER"*)
                trap - ERR
                echo "Production app version verified: $APP_BUILD_NUMBER"
                exit 0
                ;;
            esac
            sleep 2
          done

          echo "Production app version health check failed" >&2
          exit 1
          REMOTE
