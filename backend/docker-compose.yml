services:
  redis:
    image: redis:7-alpine
    container_name: aipod-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  fish-speech:
    image: fishaudio/fish-speech:server-cpu
    container_name: aipod-fish-speech
    ports:
      - "8080:8080"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./references:/app/references
    environment:
      - LLAMA_CHECKPOINT_PATH=checkpoints/openaudio-s1-mini
      - DECODER_CHECKPOINT_PATH=checkpoints/openaudio-s1-mini/codec.pth
      - DECODER_CONFIG_NAME=modded_dac_vq
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: aipod-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  redis_data:
  postgres_data:
  audio_files:
