# 프로덕션 서버 배포용 Docker Compose
# 사용법:
#   1. 서버에 .env 파일 준비
#   2. docker compose -f docker-compose.prod.yml up -d

services:
  backend:
    build: .                                           # 로컬 빌드 (테스트용)
    image: hootbee/aipod-backend:latest                        # Docker Hub 이미지 사용
    container_name: aipod-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env                                         # ← 서버에 직접 만든 .env
    environment:
      DB_HOST: postgres                              # 컨테이너 간 통신은 서비스명 사용
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      TZ: Asia/Seoul
    volumes:
      - audio_files:/app/audio-files                # 오디오 파일 영구 저장
      - thumbnails:/app/thumbnails                  # 썸네일 파일 영구 저장
      - card_news_images:/app/card-news-images      # 카드뉴스 이미지 영구 저장
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: aipod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ports:
    #   - "5432:5432"                                  # 외부 접속 필요 없으면 제거

  redis:
    image: redis:7-alpine
    container_name: aipod-redis
    restart: always
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data:
  audio_files:
  thumbnails:
  card_news_images:
